<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무작위 OX 퀴즈</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4a90e2;
            --o-color: #e74c3c;
            --x-color: #3498db;
            --gray-color: #95a5a6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .quiz-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #edf2f7;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .stats {
            font-size: 0.9rem;
            color: var(--gray-color);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
        }

        .question-box {
            font-size: 1.3rem;
            font-weight: 600;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            line-height: 1.5;
            word-break: keep-all;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .btn {
            flex: 1;
            border: none;
            border-radius: 12px;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            color: white;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-o { background-color: var(--o-color); }
        .btn-x { background-color: var(--x-color); }

        .btn-reset {
            background-color: transparent;
            color: var(--gray-color);
            border: 1px solid #e2e8f0;
            padding: 8px 16px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background-color: #edf2f7;
            color: #4a5568;
        }

        .result-message {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 24px;
        }
        
        .correct { color: #2ecc71; }
        .wrong { color: #e74c3c; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    
    <div class="stats">
        <span id="progressText">진행도: 0/0</span>
        <button class="btn-reset" onclick="resetProgress()">초기화</button>
    </div>

    <div class="question-box" id="questionBox">
        문제를 불러오는 중입니다...
    </div>

    <div class="btn-group" id="btnGroup">
        <button class="btn btn-o" onclick="submitAnswer(true)">O</button>
        <button class="btn btn-x" onclick="submitAnswer(false)">X</button>
    </div>

    <div class="result-message" id="resultMessage"></div>
</div>

<script>
    // 여기에 문제 데이터를 직접 입력하세요!
    const rawQuestions = [
        { text: "대한민국의 수도는 서울이다.", answer: true },
        { text: "지구는 평평하다.", answer: false },
        { text: "고래는 포유류에 속한다.", answer: true },
        { text: "태양은 서쪽에서 뜬다.", answer: false },
        { text: "자바스크립트는 프로그래밍 언어이다.", answer: true }
    ];

    let questions = [];
    let currentQuestion = null;

    // 데이터 초기화
    function initQuiz() {
        const cachedData = localStorage.getItem('quiz_questions');
        
        if (cachedData) {
            questions = JSON.parse(cachedData);
        } else {
            // 처음 실행 시 원본 데이터를 사용하여 초기화
            questions = rawQuestions.map(q => ({...q, solved: false}));
            saveToCache();
        }
        showNextQuestion();
    }

    function saveToCache() {
        localStorage.setItem('quiz_questions', JSON.stringify(questions));
    }

    function showNextQuestion() {
        const unsolved = questions.filter(q => !q.solved);
        const total = questions.length;
        const solvedCount = total - unsolved.length;

        const progressPercent = total > 0 ? (solvedCount / total) * 100 : 0;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;
        document.getElementById('progressText').innerText = `진행도: ${solvedCount}/${total}`;
        document.getElementById('resultMessage').innerText = "";

        if (unsolved.length === 0) {
            document.getElementById('questionBox').innerText = "🎉 모든 문제를 풀었습니다!";
            document.getElementById('btnGroup').style.display = 'none';
            return;
        }

        document.getElementById('btnGroup').style.display = 'flex';
        const randomIndex = Math.floor(Math.random() * unsolved.length);
        currentQuestion = unsolved[randomIndex];
        document.getElementById('questionBox').innerText = currentQuestion.text;
    }

    function submitAnswer(userAnswer) {
        if (!currentQuestion) return;

        const resultEl = document.getElementById('resultMessage');
        
        if (currentQuestion.answer === userAnswer) {
            resultEl.innerText = "정답입니다! 👍";
            resultEl.className = "result-message correct";
        } else {
            resultEl.innerText = "틀렸습니다! 😮";
            resultEl.className = "result-message wrong";
        }

        // 문제 해결 표시
        currentQuestion.solved = true;
        saveToCache();

        setTimeout(() => {
            showNextQuestion();
        }, 1200);
    }

    function resetProgress() {
        if (confirm("진행 상황을 모두 초기화하고 문제를 처음부터 다시 푸시겠습니까?")) {
            questions = rawQuestions.map(q => ({...q, solved: false}));
            saveToCache();
            showNextQuestion();
        }
    }

    window.onload = initQuiz;
</script>

</body>
</html>
