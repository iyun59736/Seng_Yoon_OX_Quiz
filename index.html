<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카테고리 선택형 OX 퀴즈</title>
    <style>
        :root {
            --bg-color: #f5f7fa; --card-bg: #ffffff; --text-color: #333333;
            --primary-color: #4a90e2; --o-color: #e74c3c; --x-color: #3498db;
            --gray-color: #95a5a6;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .quiz-container { background-color: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); width: 100%; max-width: 500px; text-align: center; }
        .hidden { display: none !important; }
        .btn-group { display: flex; gap: 20px; margin-top: 20px; }
        .btn { flex: 1; border: none; border-radius: 12px; padding: 20px; font-size: 1.5rem; font-weight: bold; cursor: pointer; color: white; transition: transform 0.1s; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-o { background-color: var(--o-color); }
        .btn-x { background-color: var(--x-color); }
        .category-list { text-align: left; margin: 20px 0; }
        .category-item { margin: 10px 0; cursor: pointer; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="startScreen">
        <h1>퀴즈 시작</h1>
        <p>카테고리를 선택하세요:</p>
        <div id="categoryList" class="category-list"></div>
        <button class="btn" style="background-color: var(--primary-color); width: 100%;" onclick="startQuiz()">시작하기</button>
    </div>

    <div id="quizScreen" class="hidden">
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="height:8px; background:var(--primary-color); width:0%;"></div></div>
        <div class="stats"><span id="progressText">진행도: 0/0</span></div>
        <div class="question-box" id="questionBox" style="font-size: 1.3rem; margin: 30px 0; min-height: 80px;"></div>
        <div class="btn-group" id="btnGroup">
            <button class="btn btn-o" onclick="submitAnswer(true)">O</button>
            <button class="btn btn-x" onclick="submitAnswer(false)">X</button>
        </div>
        <div class="result-message" id="resultMessage" style="margin-top: 20px; font-weight: bold;"></div>
        <button onclick="location.reload()" style="margin-top: 20px; cursor: pointer;">처음으로</button>
    </div>
</div>

<script>
    const rawQuestions = [
        { text: "대한민국의 수도는 서울이다.", answer: true, category: "상식" },
        { text: "지구는 평평하다.", answer: false, category: "상식" },
        { text: "자바스크립트는 언어이다.", answer: true, category: "IT" },
        { text: "태양은 서쪽에서 뜬다.", answer: false, category: "상식" },
        { text: "HTML은 프로그래밍 언어이다.", answer: false, category: "IT" }
    ];

    let filteredQuestions = [];
    let isProcessing = false; // 버튼 중복 클릭 방지 플래그

    // 초기 화면 구성
    const categories = [...new Set(rawQuestions.map(q => q.category))];
    const catListEl = document.getElementById('categoryList');
    categories.forEach(cat => {
        catListEl.innerHTML += `<div class="category-item"><input type="checkbox" value="${cat}" checked> ${cat}</div>`;
    });

    function startQuiz() {
        const checkedCats = Array.from(document.querySelectorAll('#categoryList input:checked')).map(i => i.value);
        filteredQuestions = rawQuestions.filter(q => checkedCats.includes(q.category)).map(q => ({...q, solved: false}));
        
        if (filteredQuestions.length === 0) return alert("카테고리를 선택하세요!");
        
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('quizScreen').classList.remove('hidden');
        showNextQuestion();
    }

    function showNextQuestion() {
        const unsolved = filteredQuestions.filter(q => !q.solved);
        if (unsolved.length === 0) {
            document.getElementById('questionBox').innerText = "🎉 완료!";
            document.getElementById('btnGroup').classList.add('hidden');
            return;
        }
        
        isProcessing = false; // 입력 활성화
        const randomIndex = Math.floor(Math.random() * unsolved.length);
        const currentQuestion = unsolved[randomIndex];
        document.getElementById('questionBox').dataset.id = randomIndex; // 임시 저장
        document.getElementById('questionBox').innerText = currentQuestion.text;
        document.getElementById('resultMessage').innerText = "";
        
        const progress = ((filteredQuestions.length - unsolved.length) / filteredQuestions.length) * 100;
        document.getElementById('progressFill').style.width = `${progress}%`;
    }

    function submitAnswer(userAnswer) {
        if (isProcessing) return; // 이미 답변 중이면 무시
        isProcessing = true;
        
        const qText = document.getElementById('questionBox').innerText;
        const currentQ = filteredQuestions.find(q => q.text === qText && !q.solved);
        
        if (currentQ.answer === userAnswer) {
            document.getElementById('resultMessage').innerText = "정답! 👍";
        } else {
            document.getElementById('resultMessage').innerText = "오답! 😮";
        }
        
        currentQ.solved = true;
        setTimeout(showNextQuestion, 1000);
    }
</script>
</body>
</html>
