<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무작위 OX 퀴즈</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4a90e2;
            --o-color: #e74c3c;
            --x-color: #3498db;
            --gray-color: #95a5a6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .quiz-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #edf2f7;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .stats {
            font-size: 0.9rem;
            color: var(--gray-color);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
        }

        .question-box {
            font-size: 1.3rem;
            font-weight: 600;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            line-height: 1.5;
            word-break: keep-all;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .btn {
            flex: 1;
            border: none;
            border-radius: 12px;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            color: white;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-o { background-color: var(--o-color); }
        .btn-x { background-color: var(--x-color); }

        .btn-reset {
            background-color: transparent;
            color: var(--gray-color);
            border: 1px solid #e2e8f0;
            padding: 8px 16px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background-color: #edf2f7;
            color: #4a5568;
        }

        .result-message {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 24px;
        }
        
        .correct { color: #2ecc71; }
        .wrong { color: #e74c3c; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    
    <div class="stats">
        <span id="progressText">진행도: 0/0</span>
        <button class="btn-reset" onclick="resetProgress()">진행상황 초기화</button>
    </div>

    <div class="question-box" id="questionBox">
        문제를 불러오는 중입니다...
    </div>

    <div class="btn-group" id="btnGroup">
        <button class="btn btn-o" onclick="submitAnswer(true)">O</button>
        <button class="btn btn-x" onclick="submitAnswer(false)">X</button>
    </div>

    <div class="result-message" id="resultMessage"></div>
</div>

<script>
    let questions = [];
    let currentQuestion = null;

    // 초기화 및 데이터 로드
    async function initQuiz() {
        const cachedData = localStorage.getItem('quiz_questions');
        
        if (cachedData) {
            questions = JSON.parse(cachedData);
            showNextQuestion();
        } else {
            try {
                const response = await fetch('questions.json');
                const data = await response.json();
                // JSON 구조에 맞게 solved 속성 보장 및 저장
                questions = data.map(q => ({...q, solved: q.solved || false}));
                saveToCache();
                showNextQuestion();
            } catch (error) {
                document.getElementById('questionBox').innerText = "JSON 파일을 불러오지 못했습니다. (서버 환경이나 경로를 확인해주세요)";
                console.error(error);
            }
        }
    }

    // 캐시(로컬 스토리지)에 저장
    function saveToCache() {
        localStorage.setItem('quiz_questions', JSON.stringify(questions));
    }

    // 무작위로 풀지 않은 문제 하나 가져오기
    function showNextQuestion() {
        const unsolved = questions.filter(q => !q.solved);
        const total = questions.length;
        const solvedCount = total - unsolved.length;

        // UI 업데이트
        const progressPercent = total > 0 ? (solvedCount / total) * 100 : 0;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;
        document.getElementById('progressText').innerText = `진행도: ${solvedCount}/${total}`;
        document.getElementById('resultMessage').innerText = "";

        if (unsolved.length === 0) {
            document.getElementById('questionBox').innerText = "🎉 모든 문제를 풀었습니다!";
            document.getElementById('btnGroup').style.display = 'none';
            return;
        }

        document.getElementById('btnGroup').style.display = 'flex';
        // 무작위 선택
        const randomIndex = Math.floor(Math.random() * unsolved.length);
        currentQuestion = unsolved[randomIndex];
        document.getElementById('questionBox').innerText = currentQuestion.text;
    }

    // 정답 제출 처리
    function submitAnswer(userAnswer) {
        if (!currentQuestion) return;

        const resultEl = document.getElementById('resultMessage');
        
        if (currentQuestion.answer === userAnswer) {
            resultEl.innerText = "정답입니다! 👍";
            resultEl.className = "result-message correct";
        } else {
            resultEl.innerText = "틀렸습니다! 😮";
            resultEl.className = "result-message wrong";
        }

        // 실제 원본 배열에서 해당 문제 찾아서 solved 처리
        const originalIndex = questions.findIndex(q => q.text === currentQuestion.text);
        if (originalIndex !== -1) {
            questions[originalIndex].solved = true;
        }

        saveToCache();

        // 1.2초 후 다음 문제로 이동 (정답 확인용 딜레이)
        setTimeout(() => {
            showNextQuestion();
        }, 1200);
    }

    // 진행 상황 초기화 구동
    function resetProgress() {
        if (confirm("진행 상황을 모두 초기화하고 문제를 처음부터 다시 푸시겠습니까?")) {
            questions = questions.map(q => ({...q, solved: false}));
            saveToCache();
            showNextQuestion();
        }
    }

    // 문서 로드 시 시작
    window.onload = initQuiz;
</script>

</body>
</html>
