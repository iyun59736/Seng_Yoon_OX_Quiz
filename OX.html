<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무작위 OX 퀴즈</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4a90e2;
            --o-color: #e74c3c;
            --x-color: #3498db;
            --gray-color: #95a5a6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .quiz-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .stats {
            font-size: 0.9rem;
            color: var(--gray-color);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        .question-box {
            font-size: 1.3rem;
            font-weight: 600;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            line-height: 1.5;
            word-break: keep-all;
        }

        .btn-group { display: flex; gap: 20px; margin-bottom: 25px; }
        .btn {
            flex: 1; border: none; border-radius: 12px; padding: 20px;
            font-size: 1.5rem; font-weight: bold; cursor: pointer;
            transition: transform 0.1s, opacity 0.2s; color: white;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:active:not(:disabled) { transform: scale(0.98); }
        .btn-o { background-color: var(--o-color); }
        .btn-x { background-color: var(--x-color); }
        .btn-next { background-color: var(--primary-color); width: 100%; padding: 15px; font-size: 1.1rem; border-radius: 12px; color: white; border: none; cursor: pointer; }

        .btn-reset {
            background-color: transparent; color: var(--gray-color);
            border: 1px solid #e2e8f0; padding: 8px 16px; font-size: 0.85rem;
            border-radius: 6px; cursor: pointer;
        }

        .result-message { font-size: 1.1rem; font-weight: bold; margin-top: 15px; min-height: 24px; }
        .correct { color: #2ecc71; }
        .wrong { color: #e74c3c; }

        #startScreen { display: block; }
        #quizScreen { display: none; }
        .category-checkboxes { text-align: left; margin: 20px 0; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="startScreen">
        <h2>퀴즈 카테고리 선택</h2>
        <div class="category-checkboxes" id="categoryList">로드 중...</div>
        <button class="btn btn-next" onclick="startQuiz()">퀴즈 시작</button>
    </div>

    <div id="quizScreen">
        <div class="stats">
            <span id="progressText">진행도: 0/0</span>
            <button class="btn-reset" onclick="resetProgress()">초기화</button>
        </div>
        <div class="question-box" id="questionBox"></div>
        <div class="btn-group" id="btnGroup">
            <button class="btn btn-o" id="btnO" onclick="submitAnswer(true)">O</button>
            <button class="btn btn-x" id="btnX" onclick="submitAnswer(false)">X</button>
        </div>
        <button class="btn btn-next" id="nextBtn" style="display:none;" onclick="showNextQuestion()">다음 문제로</button>
        <div class="result-message" id="resultMessage"></div>
    </div>
</div>

<script>
    let questions = [];
    let currentQuestion = null;

    // 페이지 로드 시 카테고리 목록 로드 및 기존 세션 확인
    window.onload = async () => {
        try {
            const res = await fetch('./questions/list.json');
            const categories = await res.json();
            const categoryList = document.getElementById('categoryList');
            categoryList.innerHTML = '';
            categories.forEach(cat => {
                categoryList.innerHTML += `<div><input type="checkbox" value="${cat}" checked> ${cat}</div>`;
            });
        } catch (e) {
            document.getElementById('categoryList').innerText = "카테고리 목록을 불러올 수 없습니다.";
        }

        const savedData = localStorage.getItem('quiz_data');
        if (savedData) {
            questions = JSON.parse(savedData);
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('quizScreen').style.display = 'block';
            showNextQuestion();
        }
    };

    async function startQuiz() {
        const selected = Array.from(document.querySelectorAll('#categoryList input:checked')).map(i => i.value);
        if (selected.length === 0) return alert("카테고리를 하나 이상 선택하세요.");
        
        let allQuestions = [];
        for (const cat of selected) {
            try {
                const response = await fetch(`./questions/${cat}.json`);
                const data = await response.json();
                allQuestions.push(...data.map(q => ({...q, solved: false})));
            } catch (err) { console.error(`${cat}.json 로드 실패`); }
        }
        
        questions = allQuestions;
        localStorage.setItem('quiz_data', JSON.stringify(questions));
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('quizScreen').style.display = 'block';
        showNextQuestion();
    }

    function showNextQuestion() {
        const unsolved = questions.filter(q => !q.solved);
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('btnGroup').style.display = 'flex';
        document.getElementById('btnO').disabled = false;
        document.getElementById('btnX').disabled = false;
        document.getElementById('resultMessage').innerText = "";

        const total = questions.length;
        const solvedCount = total - unsolved.length;
        document.getElementById('progressText').innerText = `진행도: ${solvedCount}/${total}`;

        if (unsolved.length === 0) {
            document.getElementById('questionBox').innerText = "🎉 모든 문제를 풀었습니다!";
            document.getElementById('btnGroup').style.display = 'none';
            return;
        }

        currentQuestion = unsolved[Math.floor(Math.random() * unsolved.length)];
        document.getElementById('questionBox').innerText = currentQuestion.text;
    }

    function submitAnswer(userAnswer) {
        document.getElementById('btnO').disabled = true;
        document.getElementById('btnX').disabled = true;
        
        if (currentQuestion.answer === userAnswer) {
            document.getElementById('resultMessage').innerText = "정답입니다! 👍";
            document.getElementById('resultMessage').className = "result-message correct";
        } else {
            document.getElementById('resultMessage').innerText = "틀렸습니다! 😮";
            document.getElementById('resultMessage').className = "result-message wrong";
        }

        currentQuestion.solved = true;
        localStorage.setItem('quiz_data', JSON.stringify(questions));
        document.getElementById('nextBtn').style.display = 'block';
    }

    function resetProgress() {
        if (confirm("진행 상황을 초기화하고 처음으로 돌아가시겠습니까?")) {
            localStorage.removeItem('quiz_data');
            location.reload();
        }
    }
</script>

</body>
</html>
